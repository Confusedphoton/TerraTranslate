name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libpipewire-0.3-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  windows-hooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [i686-pc-windows-gnu, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - run: cargo build --release --target ${{ matrix.target }} -p terratranslate-wine-hook -p terratranslate-wine-injector
