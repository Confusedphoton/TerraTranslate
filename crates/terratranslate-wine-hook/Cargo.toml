[package]
name = "terratranslate-wine-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
terratranslate-wine-protocol = { path = "../terratranslate-wine-protocol" }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# minhook 0.9.0 bundles upstream MinHook 1.3.4. Keep this exact pin in sync with
# THIRD_PARTY_LICENSES/MinHook.txt.
minhook = { version = "=0.9.0", path = "../../vendor/minhook" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
