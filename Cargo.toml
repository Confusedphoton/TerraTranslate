[workspace]
resolver = "2"
exclude = ["vendor/minhook"]
members = [
    "crates/terratranslate-core",
    "crates/terratranslate-store",
    "crates/terratranslate-provider",
    "crates/terratranslate-engine",
    "crates/terratranslate-platform-linux",
    "crates/terratranslate-native-hook",
    "crates/terratranslate-plugin-api",
    "crates/terratranslate-plugin-runner",
    "crates/terratranslate-wine-protocol",
    "crates/terratranslate-wine-hook",
    "crates/terratranslate-wine-injector",
    "crates/terratranslate-app",
    "crates/terratranslate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Confusedphoton/TerraTranslate"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
atspi = { version = "0.30", features = ["tokio"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts", "pipewire"] }
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-util = "0.3"
libloading = "0.9"
libc = "0.2"
pipewire = "0.9.2"
png = "0.18"
relm4 = "0.11.0"
regex = "1.13"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmp-serde = "1.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.21", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
